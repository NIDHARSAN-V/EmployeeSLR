events {}

http {
  # Upstreams refer to the Docker service names on the same network
  upstream frontend {
    server employeeslr-frontend:3000;
  }

  upstream api {
    server employeeslr-server:8000;
  }

  server {
    listen 80;
    server_name _;

    # Serve the Next.js app
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the Node server
    location /api/ {
      proxy_pass http://api/;  # note trailing slash
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # If you ever use websockets/streaming:
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}