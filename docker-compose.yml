version: "3.8"

services:
  proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - server
    networks:
      - app-network

  frontend:
    image: nidharsan8008/frontend_next_image:latest
    container_name: employeeslr-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api   
    expose:
      - "3000"                       
    depends_on:
      - server
    networks:
      - app-network

  server:
    image: nidharsan8008/server_node_image:latest
    container_name: employeeslr-server
    environment:
      - MONGO_URI=mongodb://mongodb:27017/employeeslr
    expose:
      - "8000"                         
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: employeeslr-mongo
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network: